<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>RoTv | مدیریت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--card:rgba(160,80,255,.09);--line:rgba(190,110,255,.28);--tx:#f6eeff;--mut:#b9a4d8;--a:#a23dff;--b:#ff2fd0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--tx);background:#000 radial-gradient(700px 500px at 85% -5%,rgba(122,31,255,.38),transparent 60%) no-repeat;background-attachment:fixed;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:24px;margin:0 0 6px}h3{margin:22px 0 8px;color:#d9b8ff}
.n{color:var(--mut);font-size:13px}
input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--tx);font:inherit;font-size:15px;min-width:0}
label{display:block;margin:12px 0 0;color:var(--mut);font-size:13px}
label input{margin-top:4px}
button{font:inherit;color:var(--tx);cursor:pointer}
.b{background:linear-gradient(135deg,var(--a),var(--b));border:0;color:#fff;font-weight:700;border-radius:999px;padding:11px 22px}
.g{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-top:6px}
.x{background:none;border:1px solid var(--line);border-radius:10px;width:40px;flex:none}
.tabs{display:flex;gap:6px;margin:16px 0;position:sticky;top:env(safe-area-inset-top,0px);background:#000c;backdrop-filter:blur(10px);padding:8px 0;z-index:5}
.tabs button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px}
.tabs .on{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;color:#fff}
.r{display:flex;gap:6px;margin:6px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
ol{padding-right:20px;color:var(--mut)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--a);color:#fff;padding:8px 18px;border-radius:12px;display:none;z-index:9}
</style>
<script src="../config.js"></script>
</head>
<body>
<div class="wrap" id="login">
  <h1>ورود مدیر RoTv</h1>
  <div class="n">رمز پیش‌فرض 1234 است؛ بعد از ورود از بخش تنظیمات عوضش کن.</div>
  <label>رمز<input id="pw" type="password" autocomplete="current-password"></label>
  <p><button class="b" id="in">ورود</button></p>
</div>
<div class="wrap" id="app" hidden>
  <h1>پنل مدیریت RoTv</h1>
  <div class="n" id="draft"></div>
  <div class="tabs"><button data-t="p" class="on">محصولات</button><button data-t="c">تنظیمات</button><button data-t="u">انتشار</button></div>
  <div id="body"></div>
</div>
<div class="toast" id="toast"></div>
<script>
var $=function(i){return document.getElementById(i)};
var K={s:"استارز",p:"پرمیوم",g:"گیفت استارزی",n:"گیفت پورتالز"};
function H(s){var a=3735928559,b=1103547991;for(var i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
function GF(){var o=[];[["🧸","خرس"],["💗","قلب صورتی"],["🌹","رز"],["🎁","کادو"],["🎂","کیک"],["💐","دسته گل"],["🚀","موشک"],["🍾","شامپاین"],["🏆","جام"],["💍","حلقه"],["💎","الماس"]].forEach(function(a,i){o.push({id:"g"+i,k:"g",e:a[0],n:a[1],p:0,q:0})});
[["🐸","Plush Pepe"],["🧢","Durov's Cap"],["💖","Heart Locket"],["🍑","Precious Peach"],["🎒","Loot Bag"],["🔮","Astral Shard"],["⌚","Swiss Watch"],["💍","Signet Ring"],["🌹","Eternal Rose"],["🎩","Top Hat"],["🧪","Love Potion"],["💠","Ion Gem"]].forEach(function(a,i){o.push({id:"n"+i,k:"n",e:a[0],n:a[1],p:0,q:0})});return o}
function DEF(){var it=[];[50,100,250,500,1000,2500].forEach(function(q){it.push({id:"s"+q,k:"s",q:q,p:0})});[3,6,12].forEach(function(q){it.push({id:"p"+q,k:"p",q:q,p:0})});
return{cfg:{bot:"Ro_Tvbot",support:"TtVT7701",card:"5022291621189396",holder:"محمدطاها شامی",bank:"پاسارگاد",ton:0,margin:0},items:it.concat(GF())}}
var S,tab="p",hasDraft=false;
function init(){var d=null;try{d=JSON.parse(localStorage.getItem("rotv_draft"))}catch(e){}
hasDraft=!!(d&&d.items);S=hasDraft?d:JSON.parse(JSON.stringify(window.ROTV&&window.ROTV.items?window.ROTV:DEF()));
$("draft").textContent=hasDraft?"پیش‌نویس ذخیره‌شده روی این دستگاه بارگذاری شد.":""}
function recalc(){var r=+S.cfg.ton||0,m=+S.cfg.margin||0;S.items.forEach(function(x){if(x.k=="n"&&x.t>0&&r>0)x.p=Math.round(x.t*r*(1+m/100)/1000)*1000})}
function sv(){recalc();try{localStorage.setItem("rotv_draft",JSON.stringify(S))}catch(e){}}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},1800)}
function esc(s){return String(s).replace(/"/g,"&quot;")}
function draw(){var b=$("body"),h="";
if(tab=="p"){["s","p","g","n"].forEach(function(k){h+="<h3>"+K[k]+"</h3>";S.items.forEach(function(x,i){if(x.k!=k)return;
h+='<div class="r">'+(x.n!==undefined?'<input data-i="'+i+'" data-f="n" value="'+esc(x.n)+'">':'<input type="number" data-i="'+i+'" data-f="q" placeholder="'+(k=="s"?"تعداد استارز":"تعداد ماه")+'" value="'+x.q+'">')+'<input type="number" data-i="'+i+'" data-f="p" placeholder="قیمت (تومان)" value="'+(x.p||"")+'">'+(k=="n"?'<input type="number" step="any" data-i="'+i+'" data-f="t" placeholder="TON" value="'+(x.t||"")+'">':"")+'<button class="x" data-del="'+i+'">✕</button></div>'});
h+='<button class="g" data-add="'+k+'">+ افزودن</button>'});
h+='<p class="n">برای گیفت‌های پورتالز اگر قیمت TON و «قیمت هر TON» در تنظیمات را بزنی، تومان خودکار حساب می‌شود.</p>'}
else if(tab=="c"){[["card","شماره کارت"],["holder","نام صاحب کارت"],["bank","نام بانک"],["bot","یوزرنیم ربات (بدون @)"],["support","یوزرنیم ادمین پشتیبانی (بدون @)"],["ton","قیمت هر TON به تومان"],["margin","درصد سود گیفت‌های پورتالز"]].forEach(function(f){h+='<label>'+f[1]+'<input data-c="'+f[0]+'" value="'+esc(S.cfg[f[0]]||"")+'"></label>'});
h+='<label>رمز جدید مدیر<input type="password" data-pw placeholder="خالی = بدون تغییر"></label>'}
else{h='<div class="box"><b>انتشار تغییرات روی سایت</b><ol><li>روی «دانلود config.js» بزن.</li><li>فایل را در هاست کنار index.html آپلود کن و فایل قبلی را جایگزین کن.</li><li>بعد از رفرش، مشتری‌ها قیمت‌ها و تنظیمات جدید را می‌بینند.</li></ol><p><button class="b" id="dl">دانلود config.js</button> <button class="g" id="cp">کپی متن</button></p></div><p><button class="g" id="rs">پاک‌کردن پیش‌نویس و بازگشت به config.js</button></p><p class="n">برای امنیت واقعی، پوشه admin را در هاست با «رمزگذاری پوشه» (Password Protect Directories) هم قفل کن.</p>'}
b.innerHTML=h}
function txt(){return"window.ROTV="+JSON.stringify(S,null,1)+";"}
document.addEventListener("change",function(e){var t=e.target,i=t.dataset.i;
if(i!==undefined){var x=S.items[i],f=t.dataset.f;x[f]=(f=="n")?t.value:(+t.value||0);sv();if(f=="t")draw();toast("ذخیره شد")}
else if(t.dataset.c){var c=t.dataset.c;S.cfg[c]=(c=="ton"||c=="margin")?(+t.value||0):t.value.trim();sv();toast("ذخیره شد")}
else if(t.hasAttribute("data-pw")&&t.value){S.cfg.ph=H(t.value);sv();t.value="";toast("رمز جدید ذخیره شد")}});
document.addEventListener("click",function(e){var t=e.target;
if(t.dataset.t){tab=t.dataset.t;document.querySelectorAll("[data-t]").forEach(function(b){b.classList.toggle("on",b==t)});draw()}
else if(t.dataset.del!==undefined){S.items.splice(+t.dataset.del,1);sv();draw()}
else if(t.dataset.add){var k=t.dataset.add,o={id:k+Date.now(),k:k,p:0,q:k=="s"?100:k=="p"?1:0};if(k=="g"){o.e="🎁";o.n="گیفت جدید"}if(k=="n"){o.e="✨";o.n="New Gift"}S.items.push(o);sv();draw()}
else if(t.id=="dl"){dl()}
else if(t.id=="cp"){try{navigator.clipboard.writeText(txt()).then(function(){toast("کپی شد")})}catch(x){toast("کپی نشد")}}
else if(t.id=="rs"){try{localStorage.removeItem("rotv_draft")}catch(x){}init();draw();toast("بازگردانی شد")}});
async function dl(){var d=txt();try{if(window.claude){var c=await claude.use("downloads");if(c){await c.save({filename:"config.js",data:d});return}}}catch(x){}
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type:"text/javascript"}));a.download="config.js";document.body.appendChild(a);a.click();a.remove()}
init();
$("in").onclick=function(){var want=S.cfg.ph||H("1234");if(H($("pw").value)===want){$("login").hidden=true;$("app").hidden=false;draw()}else toast("رمز اشتباه است")};
$("pw").onkeydown=function(e){if(e.key=="Enter")$("in").onclick()};
</script>
</body>
</html>
